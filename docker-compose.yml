version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          memory: 1G
    # Production security settings
    security_opt:
      - no-new-privileges:true

  # Cache
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # Main backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ALGORITHM: ${ALGORITHM:-RS256}
      ENVIRONMENT: production
      # Additional environment variables from your config
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend-network
      - frontend-network
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true  # Production security: read-only filesystem
    tmpfs:
      - /tmp  # Temporary writable mount if needed
    
  # AI Model Service
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend-network
      - frontend-network
    security_opt:
      - no-new-privileges:true

  # Rasa Action Server
  action-server:
    build:
      context: ./backend/rasa/actions
      dockerfile: Dockerfile
    restart: always
    environment:
      OLLAMA_URL: http://ollama:11434
      BACKEND_URL: http://backend:8000/api/v1
      # Include other env vars from your .env file
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # Rasa Server
  rasa:
    image: rasa/rasa:3.9.3-pro
    restart: always
    volumes:
      - ./backend/rasa:/app
    entrypoint: ["/bin/bash", "/app/rasa_entrypoint.sh"]
    depends_on:
      action-server:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network  # Expose to frontend for direct communication
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${FRONTEND_API_URL:-https://api.ucc-event-manager.com}
        REACT_APP_ENVIRONMENT: production
    restart: always
    networks:
      - frontend-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true

  # Nginx for routing and TLS termination
  nginx:
    image: nginx:1.25-alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - rasa
    networks:
      - frontend-network
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true  # Read-only filesystem for security
    tmpfs:
      - /var/cache/nginx  # Writable cache directory
      - /var/run          # Writable run directory

networks:
  backend-network:
    driver: bridge
    internal: true  # Not exposed to external network
  frontend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data: 