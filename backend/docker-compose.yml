services:
  postgres:
    image: postgres:15.4-alpine
    container_name: ucc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ucc_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ucc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ucc_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_CONTEXT_LENGTH=4096
    healthcheck:
      test: ["CMD-SHELL", "curl -s --fail http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  action-server:
    build:
      context: ./rasa/actions
    container_name: ucc_action_server
    user: "root"
    env_file:
      - .env
    environment:
      RASA_PRO_LICENSE: ${RASA_PRO_LICENSE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_API_BASE: "http://ollama:11434"
      OLLAMA_MODEL: "llama3:8b"
      BACKEND_API_URL: "http://backend:8000/api/v1"
      RASA_SERVICE_API_KEY: ${RASA_SERVICE_API_KEY}
    ports:
      - "5055:5055"
    volumes:
      - ./rasa/actions:/app/actions
      - ./rasa/endpoints.yml:/app/endpoints.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - ollama
    command: ["start", "--actions", "actions", "--cors", "*", "--debug"]

  # Rasa chatbot (optional, comment out if not needed)
  rasa:
    image: europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro:3.9.3
    container_name: ucc_rasa
    user: "root"
    env_file:
      - .env
    environment:
      RASA_PRO_LICENSE: ${RASA_PRO_LICENSE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_API_BASE: "http://ollama:11434"
      OLLAMA_MODEL: "llama3:8b"
    ports:
      - "5005:5005"
    volumes:
      - ./rasa/models:/app/models
      - ./rasa/data:/app/data
      - ./rasa/config.yml:/app/config.yml
      - ./rasa/domain.yml:/app/domain.yml
      - ./rasa/endpoints.yml:/app/endpoints.yml
      - ./rasa_entrypoint.sh:/app/entrypoint.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - action-server
      - ollama
    entrypoint: ["/app/entrypoint.sh"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucc_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/ucc_events
      REDIS_URL: redis://redis:6379/0
      RASA_URL: http://rasa:5005
      ENVIRONMENT: development
      DEBUG: "true"
      RASA_SERVICE_API_KEY: ${RASA_SERVICE_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./schemas:/app/schemas
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rasa:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  ollama_data: