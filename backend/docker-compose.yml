version: '3.8'

services:
  postgres:
    image: postgres:15.4-alpine
    container_name: ucc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ucc_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ucc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucc_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/ucc_events
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Rasa chatbot (optional, comment out if not needed)
  rasa:
    image: rasa/rasa:3.6.21
    container_name: ucc_rasa
    ports:
      - "5005:5005"
    volumes:
      - ./rasa:/app
    depends_on:
      - action-server
    command: run --enable-api --cors "*" --debug

  action-server:
    image: rasa/rasa-sdk:3.6.2
    container_name: ucc_action_server
    ports:
      - "5055:5055"
    volumes:
      - ./rasa/actions:/app/actions

volumes:
  postgres_data:
  redis_data: 