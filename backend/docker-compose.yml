services:
  postgres:
    image: postgres:15.4-alpine
    container_name: ucc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ucc_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ucc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucc_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/ucc_events
      REDIS_URL: redis://redis:6379/0
      RASA_URL: http://rasa:5005
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./schemas:/app/schemas
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rasa:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Rasa chatbot (optional, comment out if not needed)
  rasa:
    image: europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro:3.9.3
    container_name: ucc_rasa
    user: "root"
    env_file:
      - .env
    environment:
      RASA_PRO_LICENSE: ${RASA_PRO_LICENSE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "5005:5005"
    volumes:
      - ./rasa:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      action-server:
        condition: service_started
    command: run -m models --enable-api --cors "*" --debug

  action-server:
    image: europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro:3.9.3
    container_name: ucc_action_server
    user: "root"
    env_file:
      - .env
    environment:
      RASA_PRO_LICENSE: ${RASA_PRO_LICENSE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "5055:5055"
    volumes:
      - ./rasa:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: ["run", "actions"]

volumes:
  postgres_data:
  redis_data: 