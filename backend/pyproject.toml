[tool.poetry]
name = "ucc-event-manager"
version = "1.0.0"
description = "Secure multi-user event management system with helpdesk integration"
authors = ["UCC Event Manager Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.12"
uvicorn = {extras = ["standard"], version = "0.34.3"}
sqlalchemy = "^2.0.41"
alembic = "^1.16.1"
asyncpg = "^0.30.0"
pydantic = "^2.11.5"
pydantic-settings = "^2.9.1"
python-jose = {extras = ["cryptography"], version = "3.5.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
pyotp = "^2.9.0"
cryptography = "^45.0.3"
httpx = "^0.28.1"
aiosmtplib = "^4.0.1"
email-validator = "^2.2.0"
slowapi = "^0.1.9"
python-multipart = "^0.0.20"
bleach = "^6.2.0"
structlog = "^25.4.0"
python-dotenv = "^1.1.0"
qrcode = {extras = ["pil"], version = "8.2"}
faker = "^26.1.0"
factory-boy = "^3.3.0"
openai = "^1.86.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.1.1"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
mypy = "^1.16.0"
bandit = "^1.8.3"
pre-commit = "^4.2.0"
ipython = "^9.3.0"
dotenv-cli = "^3.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto" 