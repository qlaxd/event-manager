# The config.yml file contains the configuration of your NLU pipeline and policies.
# https://rasa.com/docs/rasa/model-configuration/

recipe: default.v1
language: en

# Configuration for the NLU pipeline.
# https://rasa.com/docs/rasa/nlu/components/
pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
- name: CountVectorsFeaturizer
  analyzer: "char_wb"
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 100
- name: EntitySynonymMapper
- name: ResponseSelector
  epochs: 100

# Configuration for the policies.
# https://rasa.com/docs/rasa/policies/
policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: UnexpecTEDIntentPolicy
  max_history: 5
  epochs: 100
- name: TEDPolicy
  max_history: 5
  epochs: 100
assistant_id: 20250609-175652-coped-deed
