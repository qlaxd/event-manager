# The config.yml file contains the configuration of your NLU pipeline and policies.
# https://rasa.com/docs/rasa/model-configuration/

recipe: default.v1
language: hu

# Configuration for the NLU pipeline.
# https://rasa.com/docs/rasa/nlu/components/
pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
- name: CountVectorsFeaturizer
  analyzer: "char_wb"
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 100
  entity_recognition: true
  # Use a higher dimensions for better entity extraction
  embedding_dimension: 128
- name: EntitySynonymMapper
- name: ResponseSelector
  epochs: 100
- name: FallbackClassifier
  threshold: 0.6
  ambiguity_threshold: 0.1
#  Extract entities using an LLM
- name: rasa.nlu.llm.LLMEntityExtractor
  llm:
    model_group: agentic_extraction
  entity_examples:
    - entity: event_title
      examples:
        - "Dinner with Anna"
        - "Team meeting"
    - entity: event_description
      examples:
        - "Need to discuss project updates"
        - "Catching up with an old friend"
    - entity: event_occurrence_text
      examples:
        - "tomorrow tuesday"
        - "next friday at 3pm"

# Configuration for the policies.
# https://rasa.com/docs/rasa/policies/
policies:
- name: MemoizationPolicy
- name: RulePolicy
  # Enable the RulePolicy to properly handle fallbacks
  core_fallback_threshold: 0.3
  core_fallback_action_name: "action_llm_fallback"
  enable_fallback_prediction: true
  # Set our custom fallback action as the default fallback action
  default_action: "action_llm_fallback"
  # Increase the priority for the RulePolicy
  priority: 5 
- name: TEDPolicy
  max_history: 5
  epochs: 100

