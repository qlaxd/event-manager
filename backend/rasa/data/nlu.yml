version: "3.1"

nlu:
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - good morning
    - good evening
    - hey there

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you around
    - see you later

- intent: affirm
  examples: |
    - yes
    - indeed
    - of course
    - that sounds good
    - correct

- intent: deny
  examples: |
    - no
    - never
    - I don't think so
    - don't like that
    - no way
    - not really

- intent: ask_create_event
  examples: |
    - How do I create a new event?
    - How can I add an event?
    - What is the process for creating an event?
    - I want to make a new event
    - create event
    - szeretnék létrehozni egy eseményt
    - új eseményt akarok
    - esemény létrehozás
    - hogyan hozhatok létre eseményt?
    - rendezvényt szeretnék szervezni

- intent: ask_edit_event
  examples: |
    - How do I edit an event?
    - How can I update an event?
    - Can I change an event's title?
    - I need to modify an event

- intent: ask_delete_event
  examples: |
    - How do I delete an event?
    - How can I remove an event?
    - I want to get rid of an event
    - delete event

- intent: ask_help
  examples: |
    - help
    - what can you do?
    - I need assistance
    - can you help me?

- intent: ask_iamabot
  examples: |
    - Are you a bot?
    - Are you a human?
    - What are you?
    - Who are you?

- intent: create_event_unstructured
  examples: |
    - csinálj egy eventet a hétvégi grillezésnek
    - hozz létre egy új eseményt a jövő heti vizsgára
    - create an event for me for tomorrow
    - create an event for dinner with Anna
    - new event: lunch meeting tomorrow
    - set up an event for my dentist appointment
    - add a new event for the team meeting
    - I need an event for the conference next week
    - please create an event for tomorrow named "meeting with John"
    - i'm going to a party tomorrow
    - I'm having dinner with my friends tomorrow
    - I'm having dinner with Emily tomorrow, create an event for this
    - Create an event for my meeting with John
    - Make a new event for tomorrow's lunch
    - Add an event for my doctor appointment next week
    - Schedule a dinner with friends for Saturday


- intent: nlu_fallback
  examples: |
    - nem értem
    - nem tudom miről beszélsz
    - ez értelmetlen
    - mit mondasz?
    - Ask ollama if I could meet my friends
    - Ask AI about the weather
    - Tell me about quantum physics
    - What is the capital of France?
    - How do I cook pasta?
    - What's the meaning of life?
    - Tell me a joke
    - Who won the last World Cup?
    - How tall is Mount Everest?
    - When was the internet invented?
    - What do you think about politics?
    - Can you help me with my homework?
    - Tell me about yourself
    - How do neural networks work?
    - What is the best programming language? 