version: "3.1"

nlu:
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - good morning
    - good evening
    - hey there

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you around
    - see you later

- intent: affirm
  examples: |
    - yes
    - indeed
    - of course
    - that sounds good
    - correct

- intent: deny
  examples: |
    - no
    - never
    - I don't think so
    - don't like that
    - no way
    - not really

- intent: ask_create_event
  examples: |
    - How do I create a new event?
    - How can I add an event?
    - What is the process for creating an event?
    - I want to make a new event
    - create event
    - szeretnék létrehozni egy eseményt
    - új eseményt akarok
    - esemény létrehozás
    - hogyan hozhatok létre eseményt?
    - rendezvényt szeretnék szervezni

- intent: ask_edit_event
  examples: |
    - How do I edit an event?
    - How can I update an event?
    - Can I change an event's title?
    - I need to modify an event

- intent: ask_delete_event
  examples: |
    - How do I delete an event?
    - How can I remove an event?
    - I want to get rid of an event
    - delete event

- intent: ask_help
  examples: |
    - What can you do?
    - Help
    - I need assistance
    - How does this work?
    - What are your features?
    - How can you help me?
    - Tell me what you can do
    - segítség
    - miben tudsz segíteni?

- intent: ask_iamabot
  examples: |
    - Are you a bot?
    - Are you a human?
    - Am I talking to a bot?
    - Am I talking to a human?
    - Who are you?
    - Mi vagy te?
    - Te egy robot vagy?

# This intent is for capturing unstructured event creation requests
- intent: create_event_unstructured
  examples: |
    - Can you create an event for dinner with Emily tomorrow at 7pm?
    - I need to schedule a team meeting for next Friday at 10am
    - Add an event for my doctor appointment on Tuesday
    - Create an event titled Project Kickoff next Monday at 2pm
    - I need to create a meeting with the client tomorrow morning
    - Schedule lunch with John on Wednesday at noon
    - Create an event for my birthday party next Saturday at 8pm
    - I have a dentist appointment next Thursday at 9am
    - Can you add a coffee meeting with Anna tomorrow at 3pm?
    - Schedule a call with vendors on Friday at 11am
    - Create a movie night event for Saturday at 7pm
    - Add a gym session for tomorrow at 6am
    - I need to remember my interview on Monday at 10am
    - Schedule a team building event for next Friday at 4pm
    - Add a dinner reservation for tomorrow at 8pm
    - I have a presentation next Tuesday at 3pm
    - Create an event for shopping this weekend
    - Add a reminder for my flight on Sunday at 2pm
    - Schedule a phone call with mom tomorrow at 6pm
    - Add an event for my annual review next Thursday at 11am
    - létrehoznál egy eseményt holnap délután 4 órára?
    - eseményt szeretnék létrehozni a megbeszéléshez jövő héten
    - add hozzá a naptárhoz a pénteki ebédet Jánossal
    - készíts egy eseményt a holnapi orvosi időpontra
    - létrehoznál egy eseményt a projektzáró találkozóra jövő hétfőn 10 órakor?

- intent: nlu_fallback
  examples: |
    - nem értem
    - nem tudom miről beszélsz
    - ez értelmetlen
    - mit mondasz?
    - Ask ollama if I could meet my friends
    - Ask AI about the weather
    - Tell me about quantum physics
