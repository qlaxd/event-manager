# This is for the new LLM-based entity extraction
llm:
  default:
    type: ollama
    url: "http://host.docker.internal:11434"
    model: "deepseek-r1:8b"
  model_groups:
    - id: ollama_deepseek
      models:
        - provider: ollama
          model: deepseek-r1:8b
          # Use an environment variable for flexibility.
          # For local dev (ollama on host), set in .env: OLLAMA_API_BASE="http://host.docker.internal:11434"
          # For containerized dev, docker-compose sets it to: OLLAMA_API_BASE="http://ollama:11434"
          api_base: "${OLLAMA_API_BASE}"
      router:
        routing_strategy: least-busy

