version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - ask_create_event
  - ask_edit_event
  - ask_delete_event
  - ask_help
  - ask_iamabot
  - nlu_fallback
  - create_event_unstructured

entities:
  - event_title
  - event_description
  - event_occurrence_text

slots:
  event_title:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: event_title
  event_description:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: event_description
  event_occurrence_text:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: event_occurrence_text

responses:
  utter_greet:
    - text: "Hey! I am the UCC Event Manager assistant. How can I help?"
  utter_goodbye:
    - text: "Goodbye!"
  utter_iamabot:
    - text: "I am a bot, powered by Rasa."
  utter_help:
    - text: "I can help you with creating, editing, and deleting events. What would you like to do?"
  utter_create_event_info:
    - text: "To create a new event, click the 'Add Event' button on your dashboard and fill in the required fields: title and occurrence date/time. You can also add an optional description."
  utter_edit_event_info:
    - text: "To edit an event, find the event in your list and click the edit icon. You can only update the description of an event."
  utter_delete_event_info:
    - text: "To delete an event, find it in your list and click the delete icon. You will be asked to confirm before the event is permanently removed."
  utter_please_wait:
    - text: "One moment while I check on that for you..."
  utter_event_created_by_agent:
    - text: "Rendben, létrehoztam az eseményt '{event_title}' néven."
  utter_event_creation_failed:
    - text: "Sajnos hiba történt az esemény létrehozása közben. Kérlek, próbáld újra később."
  utter_ask_event_title:
    - text: "Milyen néven hozzam létre az eseményt?"

actions:
  - action_llm_fallback
  - action_create_event_from_llm

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true 